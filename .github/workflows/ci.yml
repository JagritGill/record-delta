name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.11', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit, exhaustive merge, failure, and CLI tests
        run: python -m unittest discover -s tests -v
      - name: Core tests with the Python decimal fallback
        run: python scripts/check_python_decimal.py
      - name: Release inventory and credential patterns
        run: python scripts/check_release.py
      - name: Offline comparison demo
        run: python -m record_delta examples/before.jsonl examples/after.jsonl --format jsonl
      - name: Equal-input CI check
        run: python -m record_delta examples/before.jsonl examples/before.jsonl --check
